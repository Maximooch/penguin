name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  link-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pydantic-spec: "pydantic==1.10.24"
          - python-version: "3.12"
            pydantic-spec: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Penguin development dependencies
        run: python -m pip install -e '.[dev]' '${{ matrix.pydantic-spec }}'
      - name: Check Link provider and authority modules
        run: |
          ruff check \
            penguin/llm/providers/link \
            penguin/web/services/external_subscription.py \
            penguin/web/services/link_inference.py \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/web/test_external_subscription_service.py \
            tests/web/test_link_execution_authority.py
          ruff format --check \
            penguin/llm/providers/link \
            penguin/web/services/external_subscription.py \
            penguin/web/services/link_inference.py \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/web/test_external_subscription_service.py \
            tests/web/test_link_execution_authority.py
      - name: Run Link provider and Pydantic compatibility contracts
        run: |
          pytest -q \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/llm/test_provider_registry.py \
            tests/web/test_link_inference_service.py \
            tests/web/test_external_subscription_service.py \
            tests/web/test_link_execution_authority.py \
            tests/api/test_opencode_provider_routes.py::test_chat_message_rejects_cross_user_subscription_authority \
            tests/api/test_opencode_provider_routes.py::test_chat_message_rejects_link_authority_from_ordinary_api_client \
            tests/api/test_opencode_provider_routes.py::test_link_capabilities_reject_ordinary_api_clients \
            tests/api/test_opencode_provider_routes.py::test_chat_message_resolves_subscription_model_through_openai

  python-goal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pydantic-spec: "pydantic==1.10.24"
          - python-version: "3.12"
            pydantic-spec: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Penguin development dependencies
        run: python -m pip install -e '.[dev]' '${{ matrix.pydantic-spec }}'
      - name: Check focused runtime modules
        run: |
          ruff check \
            penguin/core_runtime/session_goal_facade.py \
            penguin/core_runtime/session_goal_runtime.py \
            penguin/core_runtime/session_goal_store.py \
            penguin/core_runtime/session_goals.py \
            penguin/web/schemas/session_goal.py \
            penguin/web/services/session_goal.py
          ruff format --check \
            penguin/core_runtime/session_goal_facade.py \
            penguin/core_runtime/session_goal_runtime.py \
            penguin/core_runtime/session_goal_store.py \
            penguin/core_runtime/session_goals.py \
            penguin/web/schemas/session_goal.py \
            penguin/web/services/session_goal.py
      - name: Run goal, Engine, and API contracts
        run: |
          pytest -q \
            tests/core_runtime/test_session_goal_runtime.py \
            tests/core_runtime/test_session_goal_store.py \
            tests/core_runtime/test_session_goals.py \
            tests/core_runtime/test_process_lifecycle.py \
            tests/core_runtime/test_stream_events.py \
            tests/llm/test_runtime_stream_retry.py \
            tests/test_conversation_internal_visibility.py \
            tests/test_engine_task_finish_contract.py \
            tests/test_engine_run_task_thin_wrapper.py \
            tests/test_finish_task_schema_contract.py \
            tests/test_part_event_persist_callback.py \
            tests/test_runmode_project_completion.py \
            tests/test_runmode_runtime_scope.py \
            tests/api/test_opencode_command_routes.py \
            tests/api/test_opencode_session_routes.py \
            tests/api/test_sse_and_status_scoping.py \
            tests/api/test_session_view_service.py

  opencode-v2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            pydantic-spec: "pydantic==1.10.24"
          - python-version: "3.12"
            pydantic-spec: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Penguin development dependencies
        run: python -m pip install -e '.[dev]' '${{ matrix.pydantic-spec }}'
      - name: Check V2 compatibility and launcher modules
        run: |
          ruff check \
            penguin/cli/opencode_launcher.py \
            penguin/web/opencode_v2_routes.py \
            penguin/web/services/link_inference.py \
            penguin/web/services/opencode_v2.py \
            penguin/web/services/opencode_v2_events.py \
            penguin/web/services/opencode_v2_interactions.py \
            tests/test_opencode_launcher.py \
            tests/test_opencode_v2_plugin.py \
            tests/api/test_opencode_v2_routes.py \
            tests/api/test_opencode_v2_events.py \
            tests/web/test_link_inference_service.py
          ruff check --select E,F,I \
            penguin/web/middleware/auth.py \
            tests/api/test_web_auth_hardening.py
          ruff format --check \
            penguin/cli/opencode_launcher.py \
            penguin/web/middleware/auth.py \
            penguin/web/opencode_v2_routes.py \
            penguin/web/services/link_inference.py \
            penguin/web/services/opencode_v2.py \
            penguin/web/services/opencode_v2_events.py \
            penguin/web/services/opencode_v2_interactions.py \
            tests/test_opencode_launcher.py \
            tests/test_opencode_v2_plugin.py \
            tests/api/test_web_auth_hardening.py \
            tests/api/test_opencode_v2_routes.py \
            tests/api/test_opencode_v2_events.py \
            tests/web/test_link_inference_service.py
      - name: Run V2 protocol, launcher, and auth contracts
        run: |
          pytest -q \
            tests/api/test_opencode_v2_routes.py \
            tests/api/test_opencode_v2_events.py \
            tests/test_opencode_launcher.py \
            tests/test_opencode_v2_plugin.py \
            tests/test_cli_entrypoint_dispatcher.py \
            tests/web/test_link_inference_service.py
          pytest -q tests/api/test_web_auth_hardening.py \
            -k 'opencode_basic or startup_token_from_non_loopback or public_endpoint_matching_is_exact_for_sensitive_prefixes'

  tui-goal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: penguin-tui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile
      - name: Typecheck TUI
        working-directory: penguin-tui/packages/opencode
        run: bun run typecheck
      - name: Verify provider-utils response limits across peer variants
        working-directory: penguin-tui/packages/opencode
        run: bun test test/provider/provider-utils-response-limit.test.ts
      - name: Build TUI web package
        working-directory: penguin-tui/packages/web
        run: bun run build
      - name: Run goal command and session-state tests
        working-directory: penguin-tui/packages/opencode
        run: |
          bun test \
            test/cli/tui/penguin-local-command.test.ts \
            test/cli/tui/penguin-local-command-runtime.test.ts \
            test/cli/tui/prompt-penguin-send.test.ts \
            test/cli/tui/prompt-penguin-submit-gate.test.ts \
            test/tui/penguin-send.test.ts
          bun test \
            test/cli/tui/session-goal-summary.test.ts \
            test/cli/tui/sync-bootstrap.test.ts \
            test/cli/tui/sync-session-events.test.ts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test:security
      - run: yarn typecheck
      - run: yarn build
