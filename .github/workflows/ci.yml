name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tool-replay-regressions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Verify process inputs and tool-result replay without live providers
        run: >-
          uv run --locked pytest -q
          tests/tools/test_process_input_validation_regressions.py
          tests/tools/test_process_poll_empty_loop.py
          tests/llm/test_codex_log_derived_replay.py
          tests/llm/test_openai_oauth_subscription_flow.py
          tests/llm/test_streaming_provider_replay.py

  session-storage-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Verify atomic saves, failure recovery, and storage contracts
        run: >-
          uv run --locked pytest -q
          tests/system/test_atomic_session_storage.py
          tests/system/test_session_save_sync.py
          tests/core_runtime/test_session_goal_store.py
          tests/core_runtime/test_opencode_persistence.py

  windows-process-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Verify native Windows pipe capture and process cleanup
        run: uv run --locked pytest -q tests/tools/test_windows_process_runtime.py

  process-subagent-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python 3.12
      - name: Verify process, archive, messaging, and wait contracts
        run: |
          uv run --locked pytest -q \
            tests/tools/test_reliability_regressions.py \
            tests/tools/test_process_poll_empty_loop.py \
            tests/tools/test_process_runtime.py \
            tests/tools/test_process_tools.py \
            tests/tools/test_process_waiting.py \
            tests/tools/test_conversation_archive.py \
            tests/multi \
            tests/test_action_executor_subagent_events.py \
            tests/test_engine_task_finish_contract.py \
            tests/test_tool_runtime_ir.py \
            tests/test_tool_runtime_records.py
      - name: Measure a sixty-second wait without status polling
        run: uv run --locked pytest -q tests/tools/test_reliability_regressions.py -o addopts='' -m slow

  locked-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - name: Install the locked source runtime
        run: |
          git ls-files --error-unmatch uv.lock
          uv sync --locked --python 3.12
          uv run --locked python -c "import penguin.web.server; import penguin.llm.providers.link"
          git diff --exit-code -- uv.lock
      - name: Verify Link contracts with locked dependencies
        run: |
          uv run --locked pytest -q \
            tests/test_dependency_cooldown.py \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/web/test_link_inference_service.py

  link-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pydantic-spec: "pydantic==2.11.3"
          - python-version: "3.12"
            pydantic-spec: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Penguin development dependencies
        run: python -m pip install -e '.[dev]' '${{ matrix.pydantic-spec }}'
      - name: Check Link provider and authority modules
        run: |
          ruff check \
            penguin/llm/providers/link \
            penguin/web/services/external_subscription.py \
            penguin/web/services/link_inference.py \
            penguin/web/services/chat_requests.py \
            penguin/system/task_cancellation.py \
            penguin/system/tool_environment.py \
            tests/system/test_tool_environment.py \
            tests/system/test_task_cancellation.py \
            tests/web/test_chat_requests.py \
            tests/web/test_chat_request_contention.py \
            tests/web/test_chat_request_cancel.py \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/test_link_runtime_permission_policy.py \
            tests/web/test_external_subscription_service.py \
            tests/web/test_link_execution_authority.py
          ruff format --check \
            penguin/llm/providers/link \
            penguin/web/services/external_subscription.py \
            penguin/web/services/link_inference.py \
            penguin/web/services/chat_requests.py \
            penguin/system/task_cancellation.py \
            penguin/system/tool_environment.py \
            tests/system/test_tool_environment.py \
            tests/system/test_task_cancellation.py \
            tests/web/test_chat_requests.py \
            tests/web/test_chat_request_contention.py \
            tests/web/test_chat_request_cancel.py \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/web/test_external_subscription_service.py \
            tests/web/test_link_execution_authority.py
      - name: Run Link provider and Pydantic compatibility contracts
        run: |
          pytest -q \
            tests/llm/test_link_provider.py \
            tests/llm/test_link_runtime_contract.py \
            tests/llm/test_provider_registry.py \
            tests/test_link_runtime_permission_policy.py \
            tests/web/test_link_inference_service.py \
            tests/web/test_external_subscription_service.py \
            tests/web/test_link_execution_authority.py \
            tests/web/test_chat_requests.py \
            tests/web/test_chat_request_contention.py \
            tests/web/test_chat_request_cancel.py \
            tests/system/test_task_cancellation.py \
            tests/system/test_tool_environment.py \
            tests/core_runtime/test_process_runtime.py \
            tests/api/test_opencode_provider_routes.py::test_chat_message_rejects_cross_user_subscription_authority \
            tests/api/test_opencode_provider_routes.py::test_chat_message_rejects_link_authority_from_ordinary_api_client \
            tests/api/test_opencode_provider_routes.py::test_link_capabilities_reject_ordinary_api_clients \
            tests/api/test_opencode_provider_routes.py::test_chat_message_resolves_subscription_model_through_openai

  python-goal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pydantic-spec: "pydantic==2.11.3"
          - python-version: "3.12"
            pydantic-spec: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Penguin development dependencies
        run: python -m pip install -e '.[dev]' '${{ matrix.pydantic-spec }}'
      - name: Check focused runtime modules
        run: |
          ruff check \
            penguin/core_runtime/session_goal_facade.py \
            penguin/core_runtime/session_goal_runtime.py \
            penguin/core_runtime/session_goal_store.py \
            penguin/core_runtime/session_goals.py \
            penguin/web/schemas/session_goal.py \
            penguin/web/services/session_goal.py
          ruff format --check \
            penguin/core_runtime/session_goal_facade.py \
            penguin/core_runtime/session_goal_runtime.py \
            penguin/core_runtime/session_goal_store.py \
            penguin/core_runtime/session_goals.py \
            penguin/web/schemas/session_goal.py \
            penguin/web/services/session_goal.py
      - name: Run goal, Engine, and API contracts
        run: |
          pytest -q \
            tests/core_runtime/test_session_goal_runtime.py \
            tests/core_runtime/test_session_goal_store.py \
            tests/core_runtime/test_session_goals.py \
            tests/core_runtime/test_process_lifecycle.py \
            tests/core_runtime/test_stream_events.py \
            tests/llm/test_runtime_stream_retry.py \
            tests/test_conversation_internal_visibility.py \
            tests/test_engine_task_finish_contract.py \
            tests/test_engine_native_tool_isolation.py \
            tests/test_engine_run_task_thin_wrapper.py \
            tests/test_finish_task_schema_contract.py \
            tests/test_part_event_persist_callback.py \
            tests/test_runmode_project_completion.py \
            tests/test_runmode_runtime_scope.py \
            tests/api/test_opencode_command_routes.py \
            tests/api/test_opencode_session_routes.py \
            tests/api/test_sse_and_status_scoping.py \
            tests/api/test_session_view_service.py

  tui-goal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: penguin-tui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile
      - name: Typecheck TUI
        working-directory: penguin-tui/packages/opencode
        run: bun run typecheck
      - name: Verify provider-utils response limits across peer variants
        working-directory: penguin-tui/packages/opencode
        run: bun test test/provider/provider-utils-response-limit.test.ts
      - name: Build TUI web package
        working-directory: penguin-tui/packages/web
        run: bun run build
      - name: Run goal command and session-state tests
        working-directory: penguin-tui/packages/opencode
        run: |
          bun test \
            test/cli/tui/penguin-local-command.test.ts \
            test/cli/tui/penguin-local-command-runtime.test.ts \
            test/cli/tui/prompt-penguin-send.test.ts \
            test/cli/tui/prompt-penguin-submit-gate.test.ts \
            test/tui/penguin-send.test.ts
          bun test \
            test/cli/tui/session-goal-summary.test.ts \
            test/cli/tui/session-family-navigation.test.ts \
            test/cli/tui/session-list-children.test.ts \
            test/cli/tui/sync-bootstrap.test.ts \
            test/cli/tui/sync-session-events.test.ts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test:security
      - run: yarn typecheck
      - run: yarn build

  dependency-security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and test documentation security mitigations
        working-directory: docs
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn test:security
          yarn build
          git diff --exit-code -- yarn.lock
      - name: Verify the visualizer dependency graph and build
        working-directory: examples/agent-visualizer-web
        run: |
          npm ci
          npm audit
          npm run build
          git diff --exit-code -- package-lock.json
