# I think this is redundant

workspace:
  path: "/tmp/penguin_workspace"

model:
  default: openai/gpt-5-codex
  provider: openrouter
  client_preference: openrouter
  streaming_enabled: true
  temperature: 0.3
  context_window: 272000
  max_output_tokens: null
api:
  base_url: null
tools:
  enabled: true
  allow_web_access: true
  allow_file_operations: true
  allow_code_execution: true
diagnostics:
  enabled: true
  verbose_logging: true

# Optional Telegram bot. Credentials are read from the named environment
# variables and must never be placed in this file.
channels:
  telegram:
    enabled: false
    expected_username: Penguin_agent_bot
    transport: polling  # polling | webhook
    token_env: TELEGRAM_BOT_TOKEN

    # Empty numeric allowlists deny access by default.
    dm_policy: allowlist  # pairing | allowlist | open | disabled
    allow_from: []  # Telegram user IDs
    group_policy: allowlist  # allowlist | open | disabled
    group_allow_from: []  # Telegram group/supergroup chat IDs, usually negative
    group_sender_allow_from: []  # Telegram user IDs allowed inside those groups
    activation: mention  # mention | always
    groups: {}  # Optional trusted per-group/topic binding defaults
    open_access_acknowledged: false

    streaming:
      mode: progress  # off | edit | progress
      edit_interval_ms: 750
      include_reasoning: false

    media:
      max_download_mb: 20
      max_document_text_chars: 100000

    permissions:
      mode: workspace  # read_only | workspace | full_access
      approvals: prompt  # prompt | deny
      timeout_seconds: 300
      allow_yolo: false

    delivery:
      retry_attempts: 8
      retry_base_seconds: 1
      retry_max_seconds: 300
      dead_letter_after_hours: 24

    runtime:
      poll_timeout_seconds: 30
      request_timeout_seconds: 30
      ingress_workers: 2
      delivery_workers: 2

    webhook:
      public_url: null
      path: /api/v1/integrations/telegram/webhook
      secret_env: TELEGRAM_WEBHOOK_SECRET
      timeout_seconds: 10
      body_limit_bytes: 1048576

# CLI Display Settings
cli:
  display:
    style: "minimal"  # Options: minimal, compact, standard, detailed, streaming
    consolidate_system_messages: true  # Batch consecutive system messages to reduce blank lines
    hide_internal_markers: true  # Filter <execute>, <system-reminder>, etc. from output
    hide_tool_results: true  # Hide "Tool Result (execute)" system messages for clean output
    max_blank_lines: 2  # Maximum consecutive blank lines allowed in output
    deduplicate_messages: true  # Skip rendering duplicate messages
    show_timestamps: true  # Show timestamps in message headers
    show_metadata: false  # Show token counts and other metadata in message headers
